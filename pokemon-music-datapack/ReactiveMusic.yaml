name: "Dr. Drunk Cobblemon Soundtrack"
version: "1.0"
author: "Dr. Dronken"
description: "A configuration for the Pokémon soundtracks of several generation 3-5 pokemon games (RSE/HGSS/DPPt/BW/BW2)"

credits: ""

musicSwitchSpeed: INSTANT
musicDelayLength: NORMAL

entries:
  # ==========================================
  # SUBMERGED & UNDERWATER (HIGH PRIORITY)
  # ==========================================

  - events: ["MAIN_MENU"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "bw_title_screen"
      - "bw2_opening_movie"
      - "bw2_title_screen"
      - "dppt_opening_movie"
      - "frlg_opening_movie"
      - "frlg_title_screen"
      - "hgss_opening_movie"
      - "hgss_title_screen"
      - "rse_opening_movie"
      - "rse_opening_movie_2"
      - "rse_title_screen"


  - events: ["BIOMETAG=DEEP_OCEAN", "BLOCK=prismarine,200"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "bw_abyssal_ruins"

  - events: ["UNDERGROUND || DEEP_UNDERGROUND || BIOMETAG=IS_CAVE", "UNDERWATER"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_cave_of_origin"

  - events: ["UNDERWATER"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_dive"

  # ==========================================
  # GLOBAL WEATHER OVERRIDES (HIGH PRIORITY)
  # ==========================================

  - events: ["STORM"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_heavy_rain"

  - events: ["SNOW"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "dppt_route_216_day"
      - "dppt_route_216_night"

  # ==========================================
  # The end
  # ==========================================

  - events: ["DIM=THE_END"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "dppt_distortion_world"
  # ==========================================
  # BIOME-SPECIFIC VILLAGE MUSIC (VILLAGE)
  # ==========================================
  - events:
      [
        "VILLAGE",
        "DAY",
        "BLOCK=cobblemon:healing_machine,1",
        "BLOCK=cobblemon:pc,1",
      ]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "dppt_pokemon_center_day"

  - events:
      [
        "VILLAGE",
        "NIGHT",
        "BLOCK=cobblemon:healing_machine,1",
        "BLOCK=cobblemon:pc,1",
      ]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "dppt_pokemon_center_night"

  # 1. Snowy / Ice / Taiga Settlements
  - events: [ "VILLAGE", "BIOME=snowy_plains || BIOME=grove || BIOMETAG=IS_SNOWY || BIOMETAG=IS_ICY || BIOME=FROZEN_RIVER"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "dppt_snowpoint_city_day"
      - "dppt_snowpoint_city_night"
      - "bw_icirrus_city"
      - "bw2_frozen_city"

  # 2. Coastal / Ocean / Beach Settlements
  - events: ["VILLAGE", "BIOMETAG=IS_OCEAN || BIOMETAG=IS_BEACH"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_dewford_town"
      - "rse_lilycove_city"
      - "rse_slateport_city"
      - "hgss_vermilion_city"
      - "hgss_cinnabar_island"
      - "frlg_cinnabar_island"
      - "dppt_canalave_city"
      - "bw_undella_town_summer"
      - "bw2_humilau_city"
      - "bw_unity_tower"
      - "rse_sootopolis_city"

  # 3. Desert / Arid / Badlands Settlements
  - events:
      ["VILLAGE", "BIOMETAG=IS_BADLANDS || BIOMETAG=IS_DESERT || BIOME=desert"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "hgss_ecruteak_city"
      - "hgss_cianwood_city"
      - "dppt_sunyshore_city_day"
      - "bw_mistralton_city"
      - "bw_anville_town"
      - "bw2_lentimas_town"
      - "hgss_lavender_town"
      - "rse_sootopolis_city"
      - "rse_fallarbor_town"

  - events: ["VILLAGE", "BIOMETAG=IS_FLORAL || BIOME=sunflower_plains"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_ever_grande_city"
