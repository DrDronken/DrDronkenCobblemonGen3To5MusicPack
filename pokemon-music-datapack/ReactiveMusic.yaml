name: "Dr. Drunk Cobblemon Soundtrack"
version: "1.0"
author: "Dr. Dronken"
description: "A configuration for the Pokémon soundtracks of several generation 3-5 pokemon games (RSE/HGSS/DPPt/BW/BW2)"

credits: ""

musicSwitchSpeed: NORMAL
musicDelayLength: NORMAL

entries:

  # ==========================================
  # GLOBAL WEATHER OVERRIDES (HIGH PRIORITY)
  # ==========================================

  - events: [ "WEATHER=THUNDER" ]
    songs:
      - "rse_heavy_rain"

  # ==========================================
  # SUBMERGED & UNDERWATER (HIGH PRIORITY)
  # ==========================================

  - events: [ "UNDERWATER" ]
    songs:
      - "rse_dive"


  # ==========================================
  # The end
  # ==========================================

  - events: [ "DIM=THE_END" ]
    forceStopMusicOnValid: true
    songs:
      - "dppt_distortion_world"
  # ==========================================
  # BIOME-SPECIFIC VILLAGE MUSIC (VILLAGE)
  # ==========================================

  # 1. Snowy / Ice / Taiga Settlements
  - events: [ "VILLAGE", "BIOMETAG=IS_TAIGA || BIOMETAG=IS_SNOWY || BIOME=snowy_plains" ]
    songs:
      - "dppt_snowpoint_city_day"
      - "bw2_frozen_city"
      - "bw_icirrus_city"

  # 2. Coastal / Ocean / Beach Settlements
  - events: [ "VILLAGE", "BIOMETAG=IS_OCEAN || BIOMETAG=IS_BEACH" ]
    songs:
      - "rse_dewford_town"
      - "rse_lilycove_city"
      - "rse_slateport_city"
      - "hgss_vermilion_city"
      - "hgss_cinnabar_island"
      - "dppt_canalave_city"
      - "bw_undella_town_summer"
      - "bw2_humilau_city"
      - "bw_unity_tower"
      - "rse_sootopolis_city"

  # 3. Desert / Arid / Badlands Settlements
  - events: [ "VILLAGE", "BIOMETAG=IS_BADLANDS || BIOMETAG=IS_DESERT || BIOME=desert" ]
    songs:
      - "hgss_ecruteak_city"
      - "hgss_cianwood_city"
      - "dppt_sunyshore_city_day"
      - "bw_mistralton_city"
      - "bw_anville_town"
      - "bw2_lentimas_town"
      - "hgss_lavender_town"

  # 4. Mountainous / Highland Settlements
  - events: [ "VILLAGE", "BIOMETAG=IS_MOUNTAIN || BIOME=windswept_hills" ]
    songs:
      - "rse_fallarbor_town"
      - "hgss_violet_city"
      - "hgss_pewter_city"
      - "dppt_oreburgh_city_day"
      - "dppt_eterna_city_day"
      - "bw_nacrene_city"
      - "bw_striaton_city"
      - "bw_black_city"
      - "bw2_black_tower"
      - "bw2_black_tower_entrance"
      - "hgss_lavender_town"
      - "hgss_indigo_plateau"
      - "bw_lacunosa_town"
      - "bw_opelucid_city_black"
      - "bw_opelucid_city_white"

  # 5. Forest / Swamp Woodland Settlements
  - events: [ "VILLAGE", "BIOMETAG=IS_FOREST || BIOMETAG=IS_SWAMP" ]
    songs:
      - "rse_petalburg_city"
      - "rse_rustboro_city"
      - "dppt_eterna_city_day"
      - "rse_fortree_city"
      - "bw_striaton_city"

  # 6. Plains / Meadows Standard Settlements (Plains Archetypes)
  - events: [ "VILLAGE", "BIOME=forest || BIOME=plains || BIOME=sunflower_plains || BIOMETAG=IS_PLAINS || BIOME=meadow" ]
    songs:
      - "hgss_goldenrod_city"
      - "hgss_celadon_city"
      - "hgss_cerulean_city"
      - "dppt_jubilife_city"
      - "dppt_jubilife_city_day"
      - "dppt_hearthome_city_day"
      - "dppt_veilstone_city_day"
      - "bw_castelia_city"
      - "bw_nimbasa_city"
      - "rse_littleroot_town"
      - "rse_oldale_town"
      - "rse_verdanturf_town"
      - "bw_nuvema_town"
      - "bw_accumula_town"
      - "rse_ever_grande_city"
      - "dppt_twinleaf_town_day"
      - "dppt_floaroma_town_day"
      - "hgss_cherrygrove_city"
      - "hgss_pallet_town"
      - "hgss_new_bark_town"
      - "dppt_sandgem_town_day"
      - "dppt_solaceon_town_day"

  # 7. Global / Dynamic Fallback Village Catch-all
  - events: [ "VILLAGE" ]
    songs:
      - "rse_oldale_town"
      - "bw_accumula_town"


  # ==========================================
  # DUNGEON & SPECIALIZED STRUCTURES
  # ==========================================

  - events: [ "STRUCTURE=minecraft:woodland_mansion" ]
    songs:
      - "bw_n_s_castle"
      - "bw2_n_s_castle"
      - "bw_dragonspiral_tower"
      - "bw_dragonspiral_tower_top_floor"
      - "bw_the_pokemon_league_besieged"
      - "bw_the_pokemon_league_besieged_alt"

  - events: [ "STRUCTURE=minecraft:desert_pyramid || STRUCTURE=minecraft:jungle_pyramid" ]
    songs:
      - "hgss_ruins_of_alph"
      - "hgss_sinjoh_ruins"
      - "bw_relic_castle"
      - "bw_dreamyard"
      - "bw_abyssal_ruins"
      - "bw2_underground_ruins"
      - "bw2_cave_of_being"

  - events: [ "STRUCTURE=minecraft:pillager_outpost" ]
    songs:
      - "hgss_sprout_tower"
      - "hgss_bell_tower"
      - "rse_high_ambient_pyre"
      - "rse_mt._pyre"

  - events: [ "STRUCTURE=minecraft:stronghold" ]
    songs:
      - "hgss_burned_tower"

  - events: [ "STRUCTURE=minecraft:shipwreck" ]
    songs:
      - "rse_abandoned_ship"
      - "rse_oceanic_museum"
      - "hgss_s.s._aqua"


  # ==========================================
  # EXTREME ENVIRONMENTS & NATURAL WILDERNESS
  # ==========================================

  - events: [ "BIOME=soul_sand_valley" ]
    songs:
      - "rse_drought"
      - "bw_relic_castle"
      - "bw_abyssal_ruins"
      - "dppt_old_chateau"

  - events:
      - "BIOME=basalt_deltas || BIOME=nether_wastes || BIOMETAG=IS_NETHER || BIOME=terralith:volcanic_peaks || BIOME=terralith:volcanic_crater || BIOME=terralith:caldera || BIOME=terralith:yellowstone || BIOME=terralith:cave/mantle_caves"
    songs:
      - "rse_mt._chimney"
      - "dppt_stark_mountain"
      - "rse_mt._pyre"
      - "bw_the_pokemon_league_besieged"
  - events: [ "BIOMETAG=IS_MOUNTAIN || UNDERGROUND" ]
    songs:
      - "dppt_mt._coronet"
      - "dppt_spear_pillar"
      - "hgss_mt._moon"
      - "rse_mt._pyre"
      - "rse_high_ambient_pyre"
      - "hgss_mt._silver"
      - "bw_twist_mountain"
      - "bw2_clay_tunnel"
      - "rse_mt._pyre_exterior"
      - "hgss_mt._moon_square"
      - "bw2_road_to_reversal_mountain"
      - "hgss_dark_cave"
      - "hgss_union_cave"
      - "bw2_reversal_mountain_black"
      - "bw2_reversal_mountain_white"
      - "rse_victory_road"
      - "dppt_victory_road"
      - "hgss_victory_road"
      - "bw_victory_road"
      - "bw2_underground_ruins"
      - "bw_chargestone_cave"
      - "ddpt_oreburgh_mine"

  - events: [ "BIOMETAG=IS_OCEAN" ]
    songs:
      - "rse_surf"
      - "dppt_surf"
      - "hgss_surf"

  - events: [ "BIOMETAG=IS_RIVER || BIOME=river" ]
    songs:
      - "bw_skyarrow_bridge"
      - "bw_driftveil_drawbridge"
      - "bw_tubeline_bridge"
      - "bw_village_bridge"
      - "bw_marvelous_bridge"

  - events: [ "BIOMETAG=IS_FOREST" ]
    songs:
      - "rse_petalburg_woods"
      - "hgss_viridian_forest"
      - "dppt_eterna_forest"
      - "bw_lostlorn_forest"
      - "bw_musical_forest_stroll"
      - "bw_white_forest"

  - events: [ "BIOMETAG=IS_SWAMP" ]
    songs:
      - "dppt_lake"

  - events: [ "BIOMETAG=IS_TAIGA || BIOME=snowy_plains || BIOME=grove" ]
    songs:
      - "dppt_route_216_day"
      - "dppt_snowpoint_city_day"
      - "bw2_frozen_city"
      - "bw_cold_storage"

  - events: [ "BIOMETAG=IS_DESERT || BIOMETAG=IS_BADLANDS" ]
    songs:
      - "rse_route_111"
      - "rse_route_113"
      - "dppt_route_228_day"
      - "bw_route_4_summer"
      - "bw_route_10"

  - events: [ "BIOME=meadow || BIOME=sunflower_plains || BIOME=plains || BIOMETAG=IS_PLAINS" ]
    songs:
      - "rse_route_101"
      - "rse_route_104"
      - "hgss_route_3"
      - "hgss_route_30"
      - "hgss_route_34"
      - "dppt_route_205_day"
      - "dppt_route_209_day"
      - "bw_route_6_summer"
      - "hgss_route_11"
      - "hgss_route_24"
      - "hgss_route_38"
      - "hgss_route_42"
      - "bw_route_1"
      - "dppt_route_201_day"
      - "hgss_route_29"

  - events: [ "BIOMETAG=IS_BEACH" ]
    songs:
      - "rse_route_110"
      - "hgss_route_47"
      - "dppt_valor_lakefront_day"
      - "rse_surf"
      - "dppt_surf"

  - events: [ "BIOMETAG=IS_SAVANNA || BIOME=windswept_hills || BIOMETAG=IS_SWAMP" ]
    songs:
      - "bw_route_10"
      - "bw_route_12_summer"
      - "bw2_route_23"
      - "dppt_route_225_day"
      - "hgss_route_26"
      - "rse_route_119"
      - "rse_route_120"
      - "dppt_route_210_day"
      - "bw2_route_22_summer"