  # 4. Mountainous / Highland Settlements
  - events: ["VILLAGE", "BIOMETAG=IS_MOUNTAIN || BIOME=windswept_hills"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_fallarbor_town"
      - "hgss_violet_city"
      - "hgss_pewter_city"
      - "dppt_oreburgh_city_day"
      - "dppt_eterna_city_day"
      - "bw_nacrene_city"
      - "bw_striaton_city"
      - "bw_black_city"
      - "bw2_black_tower"
      - "bw2_black_tower_entrance"
      - "hgss_lavender_town"
      - "bw_lacunosa_town"
      - "bw_opelucid_city_black"
      - "bw_opelucid_city_white"

  # 5. Forest / Swamp Woodland Settlements
  - events: ["VILLAGE", "BIOMETAG=IS_FOREST || BIOMETAG=IS_SWAMP || BIOMETAG=IS_TAIGA"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_petalburg_city"
      - "rse_rustboro_city"
      - "dppt_eterna_city_day"
      - "rse_fortree_city"
      - "bw_striaton_city"

  - events: ["VILLAGE", "BIOME=soul_sand_valley"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "frlg_lavender_town"

  # 6. Plains / Meadows Standard Settlements (Plains Archetypes)
  - events:
      [
        "VILLAGE",
        "BIOME=plains || BIOMETAG=IS_PLAINS || BIOME=meadow",
      ]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "hgss_goldenrod_city"
      - "hgss_celadon_city"
      - "hgss_cerulean_city"
      - "dppt_jubilife_city"
      - "dppt_jubilife_city_day"
      - "dppt_hearthome_city_day"
      - "dppt_veilstone_city_day"
      - "bw_castelia_city"
      - "bw_nimbasa_city"
      - "rse_littleroot_town"
      - "rse_oldale_town"
      - "rse_verdanturf_town"
      - "bw_nuvema_town"
      - "bw_accumula_town"
      - "rse_ever_grande_city"
      - "dppt_twinleaf_town_day"
      - "hgss_cherrygrove_city"
      - "hgss_pallet_town"
      - "hgss_new_bark_town"
      - "dppt_sandgem_town_day"
      - "dppt_solaceon_town_day"

  # 7. Global / Dynamic Fallback Village Catch-all
  - events: ["VILLAGE"]
    forceStopMusicOnValid: true
    forceStartMusicOnValid: true
    songs:
      - "rse_oldale_town"
      - "bw_accumula_town"
      - "rse_littleroot_town"
      - "rse_oldale_town"
      - "dppt_twinleaf_town_day"
      - "hgss_pallet_town"
      - "hgss_new_bark_town"
      - "dppt_sandgem_town_day"

